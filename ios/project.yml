name: SilentHall
options:
  bundleIdPrefix: com.baransel
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      SILENTHALL_SERVER_URL: "ws://localhost:3000/ws"
    Release:
      SILENTHALL_SERVER_URL: "wss://api.silenthall.app/ws"

targets:
  SilentHall:
    type: application
    platform: iOS
    sources:
      - path: SilentHall
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: Config/SilentHall-Info.plist
      properties:
        CFBundleDisplayName: SilentHall
        SilentHallServerURL: $(SILENTHALL_SERVER_URL)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Config/SilentHall.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baransel.silenthall
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: SilentHallWidgets

  SilentHallWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: SilentHallWidgets
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: Config/SilentHallWidgets-Info.plist
      properties:
        CFBundleDisplayName: SilentHall
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baransel.silenthall.widgets
