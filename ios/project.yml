name: PomoLive
options:
  bundleIdPrefix: com.baransel
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
  configs:
    Debug:
      POMOLIVE_SERVER_URL: "ws://localhost:3000/ws"
    Release:
      POMOLIVE_SERVER_URL: "wss://api.pomolive.app/ws"

targets:
  PomoLive:
    type: application
    platform: iOS
    sources:
      - path: PomoLive
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: Config/PomoLive-Info.plist
      properties:
        CFBundleDisplayName: PomoLive
        PomoLiveServerURL: $(POMOLIVE_SERVER_URL)
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Config/PomoLive.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baransel.pomolive
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PomoLiveWidgets

  PomoLiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PomoLiveWidgets
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: Config/PomoLiveWidgets-Info.plist
      properties:
        CFBundleDisplayName: PomoLive
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baransel.pomolive.widgets
