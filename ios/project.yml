name: PomoLive
options:
  bundleIdPrefix: com.baransel
  deploymentTarget:
    iOS: "26.1"
  developmentLanguage: tr
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    # Point at ws://localhost:3000/ws when running the server locally.
    POMOLIVE_SERVER_URL: "wss://api.pomolive.harbidigital.com/ws"

targets:
  PomoLive:
    type: application
    platform: iOS
    sources:
      - path: PomoLive
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: Config/PomoLive-Info.plist
      properties:
        CFBundleDisplayName: PomoLive
        CFBundleLocalizations: [tr, en]
        PomoLiveServerURL: $(POMOLIVE_SERVER_URL)
        NSSupportsLiveActivities: true
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: com.baransel.pomolive
            CFBundleURLSchemes: [pomolive]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baransel.pomolive
        CODE_SIGN_ENTITLEMENTS: Config/PomoLive.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PomoLiveWidgets

  PomoLiveWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PomoLiveWidgets
        type: syncedFolder
      - path: Shared
        type: syncedFolder
    info:
      path: Config/PomoLiveWidgets-Info.plist
      properties:
        CFBundleDisplayName: PomoLive
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baransel.pomolive.widgets
        CODE_SIGN_ENTITLEMENTS: Config/PomoLiveWidgets.entitlements
